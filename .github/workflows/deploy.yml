name: Deploy Workflow via FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload to production
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out the committed version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check deployment configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR DB_HOST DB_USER DB_PASS; do
            if [ -z "${!name}" ]; then
              echo "Missing deployment setting: $name" >&2
              exit 1
            fi
          done
          case "$FTP_SERVER_DIR" in
            */) ;;
            *) echo 'FTP_SERVER_DIR must end with /' >&2; exit 1 ;;
          esac
          for file in \
            resources/PHPMailer/src/Exception.php \
            resources/PHPMailer/src/PHPMailer.php \
            resources/PHPMailer/src/SMTP.php \
            resources/tinymce/tinymce.min.js; do
            if [ ! -f "$file" ]; then
              echo "Missing application dependency: $file" >&2
              exit 1
            fi
          done

      - name: Install MySQL support for PHP CLI and backup
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php8.3-cli php8.3-mysql default-mysql-client

      - name: Encrypt a backup of the production database
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASS"
          mysqldump --host="$DB_HOST" --user="$DB_USER" --port=3306 --lock-tables --hex-blob \
            --result-file="$RUNNER_TEMP/workflow-before-deploy.sql" xlfood_se_db_workflow
          unset MYSQL_PWD
          test -s "$RUNNER_TEMP/workflow-before-deploy.sql"
          openssl rand -hex 32 > "$RUNNER_TEMP/backup-passphrase"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass file:"$RUNNER_TEMP/backup-passphrase" \
            -in "$RUNNER_TEMP/workflow-before-deploy.sql" \
            -out "$RUNNER_TEMP/workflow-before-deploy.sql.enc"
          openssl pkeyutl -encrypt -pubin -inkey .github/production-backup-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/backup-passphrase" -out "$RUNNER_TEMP/backup-passphrase.enc"
          rm "$RUNNER_TEMP/workflow-before-deploy.sql" "$RUNNER_TEMP/backup-passphrase"
          test -s "$RUNNER_TEMP/workflow-before-deploy.sql.enc"
          test -s "$RUNNER_TEMP/backup-passphrase.enc"

      - name: Save encrypted production backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-production-before-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workflow-before-deploy.sql.enc
            ${{ runner.temp }}/backup-passphrase.enc
          if-no-files-found: error
          retention-days: 30

      - name: Apply pending production database migrations
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: xlfood_se_db_workflow
          DB_PORT: '3306'
        run: php bin/migrate.php --up --expected-db=xlfood_se_db_workflow

      - name: Upload committed application files
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.FTP_PORT || '21' }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          state-name: .workflow-ftp-deploy-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env*
            **/DEBUG/**
            **/bin/**
            **/migrations/**
            **/media/**
            **/README.md
            **/web.config
